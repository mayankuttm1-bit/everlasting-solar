<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#FFFFFF"/>
  <rect x="2" y="2" width="196" height="196" rx="14" fill="none" stroke="#F1F5F9" stroke-width="2"/>
  
  <!-- Waaree Official Sunburst Icon -->
  <g transform="translate(100, 75)">
    <!-- Central Solar Disc -->
    <circle cx="0" cy="0" r="22" fill="#E31E24"/>
    <circle cx="0" cy="0" r="14" fill="#FDB913"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    
    <!-- Radiating Solar Rays (Official Waaree geometry) -->
    <path d="M0 -34 L4 -26 L-4 -26 Z" fill="#E31E24"/>
    <path d="M0 34 L4 26 L-4 26 Z" fill="#E31E24"/>
    <path d="M-34 0 L-26 4 L-26 -4 Z" fill="#E31E24"/>
    <path d="M34 0 L26 4 L26 -4 Z" fill="#E31E24"/>
    
    <path d="M-24 -24 L-18 -16 L-24 -14 Z" fill="#FDB913"/>
    <path d="M24 -24 L18 -16 L24 -14 Z" fill="#FDB913"/>
    <path d="M-24 24 L-18 16 L-24 14 Z" fill="#FDB913"/>
    <path d="M24 24 L18 16 L24 14 Z" fill="#FDB913"/>
  </g>
  
  <!-- Official Waaree Wordmark -->
  <text x="100" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="900" fill="#E31E24" text-anchor="middle" letter-spacing="2.5">
    WAAREE
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="100" y="162" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">
    ONE WITH THE SUN
  </text>
</svg>
