<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#FFFFFF"/>
  <rect x="2" y="2" width="196" height="196" rx="14" fill="none" stroke="#F1F5F9" stroke-width="2"/>
  
  <!-- Sungrow Sun Power Emblem -->
  <g transform="translate(100, 72)">
    <!-- Outer Sun Energy Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#E8550D" stroke-width="6"/>
    
    <!-- Inner Dynamic S Curved Blades -->
    <path d="M-14 -10 C-10 -22, 12 -22, 16 -10 C18 0, 0 6, 2 16" fill="none" stroke="#E8550D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-1" cy="0" r="6" fill="#0B2B61"/>
  </g>
  
  <!-- Official Sungrow Wordmark -->
  <text x="100" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2B61" text-anchor="middle" letter-spacing="2">
    SUNGROW
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="162" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#E8550D" text-anchor="middle" letter-spacing="1.5">
    CLEAN POWER FOR ALL
  </text>
</svg>
